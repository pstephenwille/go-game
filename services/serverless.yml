# "org" ensures this Service is used with the correct Serverless Framework Access Key.
org: swille
# "app" enables Serverless Framework Dashboard features and sharing them with other Services.
app: go-game-services
# "service" is the name of this project. This will also be added to your AWS resource names.
service: go-game-services

stages:
  default:
    params:
      tableName: "index-table-${sls:stage}"

custom:
  serverless-dynamodb:
    stages:
      - dev
    start:
      noStart: true # Tells the plugin not to spawn its own Docker instance
      port: 8000
      migrate: true

provider:
  name: aws
  runtime: nodejs24.x
  architecture: arm64
  # Uncomment to easily set up a custom domain. Read the docs for more details:
  # https://www.serverless.com/framework/docs/providers/aws/guide/domains
  # domain: api.example.com
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
          Resource:
            - Fn::GetAtt: [UsersTable, Arn]
  environment:
    USERS_TABLE: ${param:tableName}

functions:
  api:
    handler: src/handler.handler
    events:
      - httpApi: "*"
build:
  esbuild:
    bundle: true
    format: esm
    minify: ${self:custom.isProd.${opt.stage}, false}
    # Enable sourcemaps for 'dev' to debug easily, disable for 'prod' to save space
    sourcemap: ${self:custom.isDev.${opt.stage}, true}
    # 👇 This injects a standard require wrapper into the ESM build file
    banner:
      js: 'import { createRequire } from "node:module"; const require = createRequire(import.meta.url);'

  isProd:
    prod: true
    dev: false
  isDev:
    prod: false
    dev: true


resources:
  Resources:
    UsersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.USERS_TABLE}
        # Only define the keys and index attributes here
        AttributeDefinitions:
          - AttributeName: userId
            AttributeType: S
          - AttributeName: email
            AttributeType: S
        KeySchema:
          - AttributeName: userId
            KeyType: HASH
        # Define Global Secondary Indexes if needed
        GlobalSecondaryIndexes:
          - IndexName: EmailIndex
            KeySchema:
              - AttributeName: email
                KeyType: HASH
            Projection:
              ProjectionType: ALL
        BillingMode: PAY_PER_REQUEST


plugins:
  - serverless-offline
